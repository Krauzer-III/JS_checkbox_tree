<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkbox Tree — тест</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="checkbox-tree.css" />
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="row g-4">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h5 mb-1">Checkbox Tree</h1>
                        <p class="text-muted small mb-3">
                            <b>▾</b> свернуть / развернуть &nbsp;·&nbsp;
                            клик по названию или чекбоксу — отметка самой ноды.
                            Отметка родителя автоматически отмечает всех детей.
                        </p>

                        <div class="d-flex flex-wrap gap-2 mb-3 pb-3 border-bottom">
                            <button type="button" class="btn btn-sm btn-outline-primary" data-action="expand">Развернуть
                                всё</button>
                            <button type="button" class="btn btn-sm btn-outline-primary" data-action="collapse">Свернуть
                                всё</button>
                            <button type="button" class="btn btn-sm btn-outline-success"
                                data-action="check-all">Отметить всё</button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-action="uncheck-all">Снять
                                всё</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"
                                data-action="demo">Демо-набор</button>

                            <div class="form-check form-switch ms-auto">
                                <input class="form-check-input" type="checkbox" id="layout-switch" />
                                <label class="form-check-label small" for="layout-switch">Многострочный вид</label>
                            </div>
                        </div>

                        <form id="tree-form">
                            <div id="tree"></div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h6 text-uppercase text-muted mb-3">Состояние</h2>
                        <pre id="result" class="bg-dark text-light rounded p-3 small mb-0"
                            style="min-height:120px; max-height:400px; overflow:auto; white-space:pre-wrap; word-break:break-word;"></pre>
                    </div>
                </div>

                <div class="card shadow-sm mt-4">
                    <div class="card-body">
                        <h2 class="h6 text-uppercase text-muted mb-3">FormData (что уйдёт в контроллер)</h2>
                        <pre id="formdata" class="bg-dark text-light rounded p-3 small mb-0"
                            style="min-height:80px; white-space:pre-wrap; word-break:break-word;"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="checkbox-tree.js"></script>
    <script>
        const testData = [
            { ID: 1, MaterialObjectTypeName: 'Оборудование', ParentID: null },
            { ID: 2, MaterialObjectTypeName: 'Насосы', ParentID: 1 },
            { ID: 3, MaterialObjectTypeName: 'Насос центробежный', ParentID: 2 },
            { ID: 4, MaterialObjectTypeName: 'Насос шестерённый', ParentID: 2 },
            { ID: 5, MaterialObjectTypeName: 'Насос вакуумный', ParentID: 2 },
            { ID: 6, MaterialObjectTypeName: 'Клапаны', ParentID: 1 },
            { ID: 7, MaterialObjectTypeName: 'Клапан обратный', ParentID: 6 },
            { ID: 8, MaterialObjectTypeName: 'Клапан предохранит.', ParentID: 6 },
            { ID: 9, MaterialObjectTypeName: 'Трубопроводы', ParentID: 1 },
            { ID: 10, MaterialObjectTypeName: 'Труба стальная', ParentID: 9 },
            { ID: 11, MaterialObjectTypeName: 'Труба ПВХ', ParentID: 9 },
            { ID: 12, MaterialObjectTypeName: 'Резервуары', ParentID: null },
            { ID: 13, MaterialObjectTypeName: 'Резервуар РВС', ParentID: 12 },
            { ID: 14, MaterialObjectTypeName: 'Резервуар РГС', ParentID: 12 },
            { ID: 15, MaterialObjectTypeName: 'Резервуар подземный', ParentID: 12 },
        ];

        const resultEl = document.getElementById('result');
        const formdataEl = document.getElementById('formdata');

        function renderResult(selectedIds) {
            const manual = tree.getManuallySelected();
            if (selectedIds.length === 0) {
                resultEl.textContent = 'Ничего не выбрано';
                return;
            }
            const allIds = [...selectedIds].sort((a, b) => a - b);
            const manualIds = [...manual].sort((a, b) => a - b);
            resultEl.textContent =
                `Выбрано всего (${allIds.length}):\n` +
                `[${allIds.join(', ')}]\n\n` +
                `Отмечено вручную (${manualIds.length}):\n` +
                `[${manualIds.join(', ')}]`;
        }

        function renderFormData() {
            const fd = new FormData(document.getElementById('tree-form'));
            const values = fd.getAll('MaterialObjectTypeIds');
            formdataEl.textContent = values.length
                ? `name="MaterialObjectTypeIds"\nvalue=[${values.join(', ')}]\nтип: int[${values.length}]`
                : 'Ничего не отмечено';
        }

        const tree = new CheckboxTree('#tree', {
            data: testData,
            name: 'MaterialObjectTypeIds',
            layout: 'list',
            onChange: (selected) => {
                renderResult(selected);
                renderFormData();
            },
        });

        renderResult([]);
        renderFormData();

        document.querySelector('[data-action="expand"]').closest('.d-flex').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            switch (btn.dataset.action) {
                case 'expand': tree.expandAll(); break;
                case 'collapse': tree.collapseAll(); break;
                case 'check-all': tree.checkAll(true); break;
                case 'uncheck-all': tree.checkAll(false); break;
                case 'demo':
                    tree.checkAll(false);
                    tree.setChecked([2], true);
                    tree.setChecked([8], true);
                    break;
            }
        });

        document.getElementById('layout-switch').addEventListener('change', (e) => {
            const selectedBefore = tree.getSelected();
            const manualBefore = tree.getManuallySelected();

            tree.layout = e.target.checked ? 'grid' : 'list';
            tree._render();

            tree.manualChecked = new Set(manualBefore);
            selectedBefore.forEach((id) => {
                const st = tree.nodes.get(id);
                if (st) {
                    st.checked = true;
                    if (st.checkbox) st.checkbox.checked = true;
                }
            });
            renderResult(tree.getSelected());
            renderFormData();
        });
    </script>
</body>

</html>
