<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tree Select Kit</title><link rel="stylesheet" href="../dist/tree-select.css"><style>body{font:14px system-ui;background:#f5f7fb;color:#253047;margin:0;padding:32px}main{max-width:1000px;margin:auto}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}h1{font-size:24px}h2{font-size:17px}@media(max-width:700px){section{grid-template-columns:1fr}}</style></head><body><main><h1>Tree Select — Checkbox + Radio</h1><p>Найди «Кресло», отметь его, затем ищи другие элементы: выбор сохранится.</p><form id="form"><section><div><h2>Множественный выбор</h2><div id="checks"></div></div><div><h2>Единственный выбор</h2><div id="radios"></div></div></section><p><button type="submit">Показать FormData</button></p></form><pre id="result"></pre></main><script src="../dist/tree-select.js"></script><script>const data=[{ID:1,ParentID:null,MaterialObjectTypeName:"Мебель"},{ID:2,ParentID:1,MaterialObjectTypeName:"Стулья"},{ID:3,ParentID:2,MaterialObjectTypeName:"Кресло"},{ID:4,ParentID:1,MaterialObjectTypeName:"Столы"},{ID:5,ParentID:4,MaterialObjectTypeName:"Письменный стол"},{ID:6,ParentID:null,MaterialObjectTypeName:"Оборудование"},{ID:7,ParentID:6,MaterialObjectTypeName:"Насос"}];new CheckboxTree("#checks",{data,name:"CategoryIds"});new RadioTree("#radios",{data,name:"SelectedCategoryId"});document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();document.getElementById("result").textContent=JSON.stringify([...new FormData(e.target).entries()],null,2)})</script></body></html>
